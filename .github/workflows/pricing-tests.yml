name: Pricing regression tests
on:
  push:
    paths: ['js/**', 'index.html', 'supabase/functions/price-proxy/**', 'tests/**', '.github/workflows/pricing-tests.yml']
  pull_request:
    paths: ['js/**', 'index.html', 'supabase/functions/price-proxy/**', 'tests/**', '.github/workflows/pricing-tests.yml']
permissions:
  contents: read
jobs:
  pricing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test tests/pricing.test.mjs
